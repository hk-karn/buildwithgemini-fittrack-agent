<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTrack AI</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-light: #f0fdfa;
    --accent-border: #99f6e4;
    --bg: #f8fafc;
    --surface: #ffffff;
    --text-primary: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --user-bubble: #0d9488;
    --agent-bubble: #ffffff;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
    color: #fff;
    padding: 0.9rem 1.4rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    box-shadow: var(--shadow-sm);
    z-index: 10;
  }
  .header-badge {
    display: inline-flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 9999px;
    padding: 0.2rem 0.6rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .app-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
    background: var(--surface);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.04);
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  .msg-row {
    display: flex;
    gap: 0.75rem;
    max-width: 85%;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg-row.agent {
    align-self: flex-start;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .avatar.agent {
    background: #ccfbf1;
    color: #0f766e;
    border: 1px solid var(--accent-border);
  }
  .avatar.user {
    background: #e2e8f0;
    color: #475569;
  }
  .msg-content {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .msg-author {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
  }
  .msg-row.user .msg-author { text-align: right; }
  .bubble {
    display: inline-block;
    padding: 0.75rem 1.05rem;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 0.95rem;
    word-break: break-word;
    white-space: pre-wrap;
    box-shadow: var(--shadow-sm);
  }
  .msg-row.agent .bubble {
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-top-left-radius: 4px;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border-top-right-radius: 4px;
  }
  /* When the reply is an A2UI card, drop bubble padding and container background */
  .bubble.rich {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    max-width: 100%;
    white-space: normal;
  }
  .prompt-chips {
    display: flex;
    gap: 0.6rem;
    padding: 0.75rem 1.25rem;
    background: #f8fafc;
    border-top: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: #ffffff;
    color: var(--accent-dark);
    border: 1px solid var(--accent-border);
    padding: 0.45rem 0.85rem;
    border-radius: 9999px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
    transition: all 0.15s ease-in-out;
  }
  .chip:hover {
    background: #f0fdfa;
    border-color: #5eead4;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem 1.25rem 1.2rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
  }
  button.send-btn {
    padding: 0.75rem 1.4rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.15s ease;
  }
  button.send-btn:hover {
    opacity: 0.93;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.15rem;
    background: #ffffff;
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; }
  .a2text.a2-h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: #0f766e; }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: #1e293b; }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; color: #334155; }
  .a2text.a2-caption { font-size: 0.85rem; color: #64748b; }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.3rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <span style="font-size: 1.3rem;">🏋️</span>
  <span>FitTrack AI</span>
  <span class="header-badge">Strength &amp; Progress Coach</span>
</header>
<div class="app-container">
  <div id="log"></div>
  <div class="prompt-chips" id="chips">
    <button type="button" class="chip" data-prompt="What exercises work best for chest and triceps?">💪 Chest &amp; Triceps Guide</button>
    <button type="button" class="chip" data-prompt="Calculate my 1RM and warm-up sets for 100 kg bench press for 5 reps">📊 1RM &amp; Zone Calculator</button>
    <button type="button" class="chip" data-prompt="Award me a milestone badge for setting a new 100 kg bench press PR!">🏆 Generate Milestone Badge</button>
  </div>
  <form id="form">
    <input id="input" placeholder="Ask your coach anything (exercises, 1RM, PR badges)…" autocomplete="off" autofocus>
    <button type="submit" class="send-btn">Send</button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar " + who, who === "agent" ? "🏋️" : "👤");
  const content = el("div", "msg-content");
  const author = el("div", "msg-author", who === "agent" ? "FitTrack AI" : "You");
  const b = el("div", "bubble");
  
  content.appendChild(author);
  content.appendChild(b);
  row.appendChild(avatar);
  row.appendChild(content);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

document.getElementById("chips")?.addEventListener("click", (ev) => {
  const chip = ev.target.closest(".chip");
  if (!chip) return;
  const prompt = chip.getAttribute("data-prompt");
  if (prompt) {
    input.value = prompt;
    form.dispatchEvent(new Event("submit"));
  }
});
</script>
</body>
</html>
